<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valiant CEO Article</title>
  <style>
    :root {
      --bg: #efe7d6;
      --panel: #fffaf0;
      --ink: #1e1b16;
      --edge: #d7c6a1;
      --action: #1e5c58;
      --action-ink: #ffffff;
      --brand-deep: #1f3a52;
      --brand-gold: #d2a24c;
      --brand-cream: #fff6e3;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, #fffef9 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .viewer {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      padding: 12px;
      border-bottom: 1px solid var(--edge);
      background:
        linear-gradient(120deg, rgba(255, 250, 240, 0.98), rgba(255, 244, 220, 0.96)),
        radial-gradient(circle at top right, rgba(30, 92, 88, 0.1), transparent 45%);
      backdrop-filter: blur(7px);
      box-shadow: 0 4px 18px rgba(35, 27, 11, 0.08);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 7px 10px;
      border-radius: 12px;
      border: 1px solid #d4c3a0;
      background: linear-gradient(135deg, var(--brand-cream), #fffdf9);
    }

    .logo-mark {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.5px;
      color: #fff;
      background:
        linear-gradient(140deg, var(--brand-deep), #2e607b 52%, var(--brand-gold));
      box-shadow: 0 3px 10px rgba(31, 58, 82, 0.3);
      overflow: hidden;
    }

    .logo-mark img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .brand-text {
      display: grid;
      line-height: 1;
      gap: 4px;
    }

    .brand-text strong {
      font-size: 13px;
      letter-spacing: 0.4px;
      color: #253243;
      font-weight: 700;
    }

    .brand-text em {
      margin: 0;
      font-style: normal;
      font-size: 11px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: #786649;
    }

    .btn {
      border: 1px solid #ccb78f;
      background: linear-gradient(180deg, #fff, #f8eedc);
      color: #2b2116;
      padding: 8px 11px;
      border-radius: 10px;
      text-decoration: none;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      border-color: #bfa06b;
      box-shadow: 0 3px 8px rgba(61, 44, 18, 0.18);
    }

    .btn.primary {
      border-color: #174a47;
      background: linear-gradient(180deg, #26716c, var(--action));
      color: var(--action-ink);
    }

    .meta {
      margin-left: auto;
      font-size: 14px;
      color: #3f372d;
      white-space: nowrap;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #dbc8a6;
      background: rgba(255, 253, 245, 0.8);
    }

    .jump {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #4d4538;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid #dbc8a6;
      background: rgba(255, 253, 245, 0.8);
    }

    .jump input {
      width: 64px;
      border: 1px solid var(--edge);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 14px;
      background: #fff;
      color: var(--ink);
    }

    .stage {
      overflow: auto;
      padding: 18px 12px 24px;
    }

    .canvas-wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(34, 26, 10, 0.12);
      padding: 10px;
    }

    #pdf-canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #fff;
      border-radius: 8px;
    }

    .status {
      width: min(1100px, 100%);
      margin: 10px auto 0;
      text-align: center;
      font-size: 14px;
      color: #665c4b;
      min-height: 1.2em;
    }

    .status-row {
      width: min(1100px, 100%);
      margin: 10px auto 0;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      min-height: 1.4em;
    }

    .spinner {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #cdbb93;
      border-top-color: #23395b;
      animation: spin 0.9s linear infinite;
      display: none;
    }

    .spinner.show {
      display: inline-block;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 700px) {
      .toolbar {
        gap: 8px;
      }

      .brand {
        width: 100%;
      }

      .btn {
        font-size: 13px;
        padding: 7px 9px;
      }

      .meta {
        width: 100%;
        margin-left: 0;
      }

      .jump {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="toolbar" role="toolbar" aria-label="PDF controls">
      <div class="brand" aria-label="Viewer branding">
        <span class="logo-mark" aria-hidden="true">
          <img src="../../../public/DD-Badge-Favicon.ico" alt="" />
        </span>
        <span class="brand-text">
          <strong>Valiant CEO</strong>
          <em>Article Viewer</em>
        </span>
      </div>
      <button class="btn" id="prev" type="button" aria-label="Previous page">Prev</button>
      <button class="btn" id="next" type="button" aria-label="Next page">Next</button>
      <button class="btn" id="zoom-out" type="button" aria-label="Zoom out">-</button>
      <button class="btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <label class="jump" for="page-jump">
        Go to
        <input id="page-jump" type="number" min="1" step="1" inputmode="numeric" aria-label="Go to page" />
      </label>
      <a class="btn primary" href="DD-ValiantCEO.pdf" target="_blank" rel="noopener">Open Full PDF</a>
      <a class="btn" href="DD-ValiantCEO.pdf" download>Download</a>
      <div class="meta">
        Page <span id="page-num">1</span> / <span id="page-count">--</span>
        <span id="zoom-label">(100%)</span>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <div class="status-row">
        <span class="spinner" id="spinner" aria-hidden="true"></span>
        <p class="status" id="status"></p>
      </div>
    </div>
  </div>

  <script src="assets/pdfjs/pdf.min.js?v=20260730"></script>
  <script>
    (function () {
      var pdfPath = "DD-ValiantCEO.pdf";
      var state = {
        pdfDoc: null,
        pageNum: 1,
        pageCount: 0,
        scale: 1.0,
        rendering: false,
        pendingPage: null
      };

      var canvas = document.getElementById("pdf-canvas");
      var ctx = canvas.getContext("2d");
      var pageNumEl = document.getElementById("page-num");
      var pageCountEl = document.getElementById("page-count");
      var zoomLabelEl = document.getElementById("zoom-label");
      var statusEl = document.getElementById("status");
      var spinnerEl = document.getElementById("spinner");
      var pageJumpEl = document.getElementById("page-jump");

      function showSpinner(show) {
        spinnerEl.classList.toggle("show", !!show);
      }

      function openDirectPdf() {
        window.location.replace(pdfPath);
      }

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function renderPage(pageNum) {
        state.rendering = true;
        showSpinner(true);
        setStatus("Rendering page " + pageNum + "...");

        state.pdfDoc.getPage(pageNum).then(function (page) {
          var viewport = page.getViewport({ scale: state.scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          var renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };

          page.render(renderContext).promise.then(function () {
            state.rendering = false;
            showSpinner(false);
            pageNumEl.textContent = String(state.pageNum);
            zoomLabelEl.textContent = "(" + Math.round(state.scale * 100) + "%)";
            setStatus("");

            if (state.pendingPage !== null) {
              var pending = state.pendingPage;
              state.pendingPage = null;
              renderPage(pending);
            }
          });
        });
      }

      function queueRenderPage(pageNum) {
        if (state.rendering) {
          state.pendingPage = pageNum;
        } else {
          renderPage(pageNum);
        }
      }

      function goToPage(pageNum) {
        if (!state.pdfDoc) {
          return;
        }
        if (pageNum < 1 || pageNum > state.pageCount) {
          return;
        }
        state.pageNum = pageNum;
        queueRenderPage(state.pageNum);
      }

      document.getElementById("prev").addEventListener("click", function () {
        goToPage(state.pageNum - 1);
      });

      document.getElementById("next").addEventListener("click", function () {
        goToPage(state.pageNum + 1);
      });

      document.getElementById("zoom-in").addEventListener("click", function () {
        state.scale = Math.min(3, state.scale + 0.15);
        queueRenderPage(state.pageNum);
      });

      document.getElementById("zoom-out").addEventListener("click", function () {
        state.scale = Math.max(0.5, state.scale - 0.15);
        queueRenderPage(state.pageNum);
      });

      pageJumpEl.addEventListener("keydown", function (event) {
        if (event.key !== "Enter") {
          return;
        }
        var requested = Number(pageJumpEl.value);
        if (!Number.isFinite(requested)) {
          return;
        }
        goToPage(Math.round(requested));
      });

      document.addEventListener("keydown", function (event) {
        if (event.target === pageJumpEl) {
          return;
        }
        if (event.key === "ArrowRight") {
          goToPage(state.pageNum + 1);
        }
        if (event.key === "ArrowLeft") {
          goToPage(state.pageNum - 1);
        }
      });

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "assets/pdfjs/pdf.worker.min.js?v=20260730";

        setStatus("Loading PDF...");
        showSpinner(true);
        pdfjsLib.getDocument(pdfPath).promise.then(function (pdfDoc) {
          state.pdfDoc = pdfDoc;
          state.pageCount = pdfDoc.numPages;
          pageCountEl.textContent = String(state.pageCount);
          pageJumpEl.max = String(state.pageCount);
          renderPage(state.pageNum);
        }).catch(function () {
          showSpinner(false);
          setStatus("Viewer unavailable. Opening full PDF...");
          setTimeout(openDirectPdf, 450);
        });
      } else {
        setStatus("Viewer script failed. Opening full PDF...");
        setTimeout(openDirectPdf, 450);
      }
    })();
  </script>
</body>
</html>
