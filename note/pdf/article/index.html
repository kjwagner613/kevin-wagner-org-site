<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Valiant CEO Article</title>
  <style>
    :root {
      --bg: #f4f0e6;
      --panel: #fffaf0;
      --ink: #1e1b16;
      --edge: #ddd3bc;
      --action: #23395b;
      --action-ink: #ffffff;
    }

    html,
    body {
      height: 100%;
      margin: 0;
      background: radial-gradient(circle at top, #fffef9 0%, var(--bg) 60%);
      color: var(--ink);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    }

    .viewer {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--edge);
      background: rgba(255, 250, 240, 0.96);
      backdrop-filter: blur(6px);
    }

    .btn {
      border: 1px solid var(--edge);
      background: #fff;
      color: var(--ink);
      padding: 7px 10px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 14px;
      line-height: 1;
      cursor: pointer;
    }

    .btn:hover {
      border-color: #cdbb93;
    }

    .btn.primary {
      border-color: var(--action);
      background: var(--action);
      color: var(--action-ink);
    }

    .meta {
      margin-left: auto;
      font-size: 14px;
      color: #4d4538;
      white-space: nowrap;
    }

    .stage {
      overflow: auto;
      padding: 18px 12px 24px;
    }

    .canvas-wrap {
      width: min(1100px, 100%);
      margin: 0 auto;
      background: var(--panel);
      border: 1px solid var(--edge);
      border-radius: 10px;
      box-shadow: 0 8px 28px rgba(34, 26, 10, 0.12);
      padding: 10px;
    }

    #pdf-canvas {
      width: 100%;
      height: auto;
      display: block;
      background: #fff;
      border-radius: 8px;
    }

    .status {
      width: min(1100px, 100%);
      margin: 10px auto 0;
      text-align: center;
      font-size: 14px;
      color: #665c4b;
      min-height: 1.2em;
    }

    @media (max-width: 700px) {
      .toolbar {
        gap: 6px;
      }

      .btn {
        font-size: 13px;
        padding: 7px 9px;
      }

      .meta {
        width: 100%;
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="viewer">
    <div class="toolbar" role="toolbar" aria-label="PDF controls">
      <button class="btn" id="prev" type="button" aria-label="Previous page">Prev</button>
      <button class="btn" id="next" type="button" aria-label="Next page">Next</button>
      <button class="btn" id="zoom-out" type="button" aria-label="Zoom out">-</button>
      <button class="btn" id="zoom-in" type="button" aria-label="Zoom in">+</button>
      <a class="btn primary" href="DD-ValiantCEO.pdf" target="_blank" rel="noopener">Open Full PDF</a>
      <a class="btn" href="DD-ValiantCEO.pdf" download>Download</a>
      <div class="meta">
        Page <span id="page-num">1</span> / <span id="page-count">--</span>
        <span id="zoom-label">(100%)</span>
      </div>
    </div>

    <div class="stage">
      <div class="canvas-wrap">
        <canvas id="pdf-canvas"></canvas>
      </div>
      <p class="status" id="status"></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    (function () {
      var pdfPath = "DD-ValiantCEO.pdf";
      var state = {
        pdfDoc: null,
        pageNum: 1,
        pageCount: 0,
        scale: 1.0,
        rendering: false,
        pendingPage: null
      };

      var canvas = document.getElementById("pdf-canvas");
      var ctx = canvas.getContext("2d");
      var pageNumEl = document.getElementById("page-num");
      var pageCountEl = document.getElementById("page-count");
      var zoomLabelEl = document.getElementById("zoom-label");
      var statusEl = document.getElementById("status");

      function setStatus(message) {
        statusEl.textContent = message || "";
      }

      function renderPage(pageNum) {
        state.rendering = true;
        setStatus("Rendering page " + pageNum + "...");

        state.pdfDoc.getPage(pageNum).then(function (page) {
          var viewport = page.getViewport({ scale: state.scale });
          canvas.height = viewport.height;
          canvas.width = viewport.width;

          var renderContext = {
            canvasContext: ctx,
            viewport: viewport
          };

          page.render(renderContext).promise.then(function () {
            state.rendering = false;
            pageNumEl.textContent = String(state.pageNum);
            zoomLabelEl.textContent = "(" + Math.round(state.scale * 100) + "%)";
            setStatus("");

            if (state.pendingPage !== null) {
              var pending = state.pendingPage;
              state.pendingPage = null;
              renderPage(pending);
            }
          });
        });
      }

      function queueRenderPage(pageNum) {
        if (state.rendering) {
          state.pendingPage = pageNum;
        } else {
          renderPage(pageNum);
        }
      }

      function goToPage(pageNum) {
        if (!state.pdfDoc) {
          return;
        }
        if (pageNum < 1 || pageNum > state.pageCount) {
          return;
        }
        state.pageNum = pageNum;
        queueRenderPage(state.pageNum);
      }

      document.getElementById("prev").addEventListener("click", function () {
        goToPage(state.pageNum - 1);
      });

      document.getElementById("next").addEventListener("click", function () {
        goToPage(state.pageNum + 1);
      });

      document.getElementById("zoom-in").addEventListener("click", function () {
        state.scale = Math.min(3, state.scale + 0.15);
        queueRenderPage(state.pageNum);
      });

      document.getElementById("zoom-out").addEventListener("click", function () {
        state.scale = Math.max(0.5, state.scale - 0.15);
        queueRenderPage(state.pageNum);
      });

      document.addEventListener("keydown", function (event) {
        if (event.key === "ArrowRight") {
          goToPage(state.pageNum + 1);
        }
        if (event.key === "ArrowLeft") {
          goToPage(state.pageNum - 1);
        }
      });

      if (window.pdfjsLib) {
        pdfjsLib.GlobalWorkerOptions.workerSrc =
          "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.5.136/pdf.worker.min.js";

        setStatus("Loading PDF...");
        pdfjsLib.getDocument(pdfPath).promise.then(function (pdfDoc) {
          state.pdfDoc = pdfDoc;
          state.pageCount = pdfDoc.numPages;
          pageCountEl.textContent = String(state.pageCount);
          renderPage(state.pageNum);
        }).catch(function () {
          setStatus("Could not load PDF in viewer. Use Open Full PDF.");
        });
      } else {
        setStatus("Viewer script failed to load. Use Open Full PDF.");
      }
    })();
  </script>
</body>
</html>
