<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Community Outreach Flyer</title>
  <style>
    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      padding: 16px;
      box-sizing: border-box;
      background: #f3f0e8;
    }

    img {
      display: block;
      width: auto;
      height: auto;
      max-width: 100%;
      max-height: calc(100vh - 32px);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <img src="communityPost.png" alt="Community outreach flyer" />
</body>
</html>
